#
# /etc/openldap/slapd.conf - RyzenOS/Lumin default OpenLDAP config
# Compatible with OpenLDAP 2.6.x
#

# Dynamic backend modules
modulepath    /usr/lib/openldap
moduleload    back_mdb.so

# Runtime files
pidfile       /run/openldap/slapd.pid
argsfile      /run/openldap/slapd.args

#######################################################################
# cn=config database
#######################################################################

database config
rootdn "cn=admin,cn=config"
rootpw admin

#######################################################################
# Main database
#######################################################################

database mdb
maxsize 1073741824

suffix   "dc=lumin,dc=local"
rootdn   "cn=Manager,dc=lumin,dc=local"
rootpw   luminadmin

# Must match ldap.tmpfiles and package-created state dir.
directory /var/lib/openldap-data

index objectClass eq
index cn,sn,uid,uidNumber,gidNumber eq,pres,sub
index mail,ou,memberUid eq,pres,sub
index uniqueMember eq,pres

access to attrs=userPassword
        by self write
        by anonymous auth
        by dn.base="cn=Manager,dc=lumin,dc=local" write
        by * none

access to *
        by dn.base="cn=Manager,dc=lumin,dc=local" write
        by * read

loglevel stats sync

# TLS/SSL options can be enabled once certs exist.
# TLSCACertificateFile  /etc/ssl/certs/ca-certificates.crt
# TLSCertificateFile    /etc/ssl/certs/openldap.crt
# TLSCertificateKeyFile /etc/ssl/private/openldap.key
