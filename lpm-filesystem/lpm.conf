# /etc/lpm/lpm.conf

[paths]
db_dir = /var/lib/lpm/db
local_db_dir = /var/lib/lpm/local
sync_db_dir = /var/lib/lpm/sync
transaction_dir = /var/lib/lpm/transactions
lock_dir = /var/lib/lpm/locks

cache_dir = /var/cache/lpm
source_cache_dir = /var/cache/lpm/sources
package_cache_dir = /var/cache/lpm/packages
lpmbuild_cache_dir = /var/cache/lpm/lpmbuilds
build_cache_dir = /var/cache/lpm/build
log_dir = /var/log/lpm

config_dir = /etc/lpm
repo_dir = /etc/lpm/repos.d
hook_dir = /etc/lpm/hooks.d
system_hook_dir = /usr/share/lpm/hooks
template_dir = /usr/share/lpm/templates

tmp_build_dir = /tmp/lpm-build

[build]
makeflags = -j$(nproc)
build_user = lpm
build_group = lpm

[policy]
require_signatures = true
allow_unsigned_local = false
clean_build_root = true
reuse_source_cache = true
reuse_lpmbuild_cache = true

[hooks]
enable_hooks = true
hook_dirs = /usr/share/lpm/hooks:/etc/lpm/hooks.d
