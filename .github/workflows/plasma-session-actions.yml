name: Plasma logout and power actions

on:
  push:
    paths:
      - "--KDE--/plasma-workspace/**"
      - ".github/workflows/plasma-session-actions.yml"
  pull_request:
    paths:
      - "--KDE--/plasma-workspace/**"
      - ".github/workflows/plasma-session-actions.yml"

jobs:
  upstream-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recipe and patch syntax
        run: |
          bash -n ./--KDE--/plasma-workspace/plasma-workspace.lpmbuild
          python3 - <<'PY'
          import hashlib, pathlib, re
          recipe = pathlib.Path("--KDE--/plasma-workspace/plasma-workspace.lpmbuild").read_text()
          patch = pathlib.Path("--KDE--/plasma-workspace/0001-logout-greeter-check-shutdown-progress.patch").read_bytes()
          hashes = re.findall(r'"([a-f0-9]{64})"', recipe)
          assert hashlib.sha256(patch).hexdigest() in hashes, "Patch SHA256 mismatch"
          assert 'RELEASE="9"' in recipe
          assert 'KDE_PAM_SERVICE="kde"' in recipe
          assert '"pam" "pam-policy"' in recipe
          assert 'test ! -e "$pkgdir/usr/lib/pam.d/${KDE_PAM_SERVICE}"' in recipe
          assert 'org.kde.LogoutPrompt' in recipe and 'org.kde.Shutdown' in recipe
          assert 'unit="plasma-dbus-logout-prompt.service"' in recipe
          assert 'unit="plasma-dbus-shutdown.service"' in recipe
          assert 'SystemdService=%s' in recipe
          assert 'Type=dbus' in recipe and 'BusName=$service' in recipe
          assert 'ExecStart=$exec' in recipe
          PY
      - name: Smoke test D-Bus / systemd activation files staged by recipe
        shell: bash
        run: |
          set -euo pipefail
          export SRCROOT="$RUNNER_TEMP/plasma-src"
          export pkgdir="$RUNNER_TEMP/plasma-stage"
          mkdir -p "$SRCROOT/plasma-workspace-6.8.1/startkde/plasma-shutdown"
          printf 'isLogoutInProgress\n' > "$SRCROOT/plasma-workspace-6.8.1/startkde/plasma-shutdown/org.kde.Shutdown.xml"
          cmake() {
            test "$1" = "--install"
            install -d "$DESTDIR/usr/libexec" "$DESTDIR/usr/lib/sddm/sddm.conf.d" "$DESTDIR/usr/share/dbus-1/services"
            touch "$DESTDIR/usr/lib/sddm/sddm.conf.d/plasma-wayland.conf"
            for exe in ksmserver ksmserver-logout-greeter plasma-shutdown; do
              install -m755 /usr/bin/true "$DESTDIR/usr/libexec/$exe"
            done
            printf '[D-BUS Service]\nName=org.kde.LogoutPrompt\nExec=/usr/libexec/ksmserver-logout-greeter\n' \
              > "$DESTDIR/usr/share/dbus-1/services/org.kde.LogoutPrompt.service"
            printf '[D-BUS Service]\nName=org.kde.Shutdown\nExec=/usr/libexec/plasma-shutdown\n' \
              > "$DESTDIR/usr/share/dbus-1/services/org.kde.Shutdown.service"
          }
          source "./--KDE--/plasma-workspace/plasma-workspace.lpmbuild"
          staging
          for name in org.kde.LogoutPrompt org.kde.Shutdown; do
            case "$name" in
              org.kde.LogoutPrompt) unit=plasma-dbus-logout-prompt.service ;;
              org.kde.Shutdown) unit=plasma-dbus-shutdown.service ;;
            esac
            grep -Fx "SystemdService=$unit" "$pkgdir/usr/share/dbus-1/services/$name.service"
            grep -Fx "BusName=$name" "$pkgdir/usr/lib/systemd/user/$unit"
          done
      - name: Download precise KDE Plasma 6.8.1 source files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            logout-greeter/greeter.cpp \
            startkde/plasma-shutdown/shutdown.h \
            startkde/plasma-shutdown/shutdown.cpp \
            startkde/plasma-shutdown/org.kde.Shutdown.xml; do
            install -d "$(dirname "$RUNNER_TEMP/src/$file")"
            curl --fail --show-error --silent --location \
              "https://raw.githubusercontent.com/KDE/plasma-workspace/v6.8.1/$file" \
              -o "$RUNNER_TEMP/src/$file"
          done
      - name: Confirm patch applies with no fuzz
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"
          patch --dry-run --fuzz=0 -p1 < "$GITHUB_WORKSPACE/--KDE--/plasma-workspace/0001-logout-greeter-check-shutdown-progress.patch"
          patch --fuzz=0 -p1 < "$GITHUB_WORKSPACE/--KDE--/plasma-workspace/0001-logout-greeter-check-shutdown-progress.patch"
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          xml = ET.parse("startkde/plasma-shutdown/org.kde.Shutdown.xml")
          assert xml.find(".//method[@name='isLogoutInProgress']") is not None
          cpp = pathlib.Path("logout-greeter/greeter.cpp").read_text()
          assert 'reply.isValid() && reply.value()' in cpp
          assert "already registered; quitting" not in cpp
          PY
