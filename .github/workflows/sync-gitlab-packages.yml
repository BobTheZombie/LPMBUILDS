name: Synchronize GitLab LPM package recipes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gitlab-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out GitHub LPMBUILDS
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Clone canonical GitLab packages
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.com/lpm-org/packages.git "$RUNNER_TEMP/lpm-gitlab"
          git -C "$RUNNER_TEMP/lpm-gitlab" rev-parse HEAD > GITLAB-SYNC-REVISION.txt

      - name: Mirror GitLab tracked files
        run: |
          set -euo pipefail
          python3 tools/github-mirror/sync_gitlab_recipes.py \
            --source "$RUNNER_TEMP/lpm-gitlab" --target .

      - name: Discover and align Plasma workspace
        run: |
          set -euo pipefail
          recipe="$(find . -type f -name '*plasma-workspace*.lpmbuild' -print -quit)"
          printf 'PLASMA_RECIPE=%s\n' "$recipe" >> "$GITHUB_ENV"
          echo "Detected Plasma recipe: ${recipe:-NOT FOUND}"
          if [ -n "$recipe" ]; then
            python3 tools/github-mirror/align_plasma_workspace.py \
              --repo . --recipe "$recipe" --report PLASMA-DEPENDENCY-AUDIT.md
            bash -n "$recipe"
          else
            echo 'GitLab has no plasma-workspace LPMBUILD; missing source recipe.' > PLASMA-DEPENDENCY-AUDIT.md
            find . -iname '*plasma*' | head -30
          fi
          python3 -m py_compile tools/github-mirror/*.py

      - name: Audit hard requirements and placeholders
        run: |
          set +e
          if [ -n "$PLASMA_RECIPE" ]; then
            python3 tools/github-mirror/check_lpmbuild_deps.py \
              --repo . --recipe "$PLASMA_RECIPE" > dependency-audit-output.txt 2>&1
            result=$?
          else
            echo 'No plasma-workspace recipe present in canonical GitLab tree' > dependency-audit-output.txt
            result=1
          fi
          echo "$result" > dependency-audit-status.txt
          cat dependency-audit-output.txt
          exit 0

      - name: Commit synchronized GitLab packages and audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Mirror canonical GitLab packages and audit Plasma dependencies"
            # Preserve concurrent GitHub changes without force-pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Mirror already synchronized"
          fi

      - name: Validate both upstream and declared dependency closure
        run: |
          set -euo pipefail
          if [ "$(cat dependency-audit-status.txt)" -ne 0 ]; then
            echo "Plasma has missing or placeholder-only declared hard dependencies"
            exit 1
          fi
          if awk '/^## Missing or placeholder-only upstream build requirements/{f=1;next} f && /^- /{found=1} END{exit !found}' PLASMA-DEPENDENCY-AUDIT.md; then
            echo "Plasma upstream CMake requirements are not fully represented by GitLab recipes"
            echo "See PLASMA-DEPENDENCY-AUDIT.md for the missing requirements"
            exit 1
          fi
          echo "Upstream and declared hard dependency names all resolve in GitLab"
